<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Profumeria Artistica - Consulente AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 40px; }
    h1 { color: #111; font-weight: 600; }
    p { color: #555; max-width: 600px; line-height: 1.5; }

    /* Bottone Galleggiante */
    .chat-toggle { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: #111; color: white; border: none; font-size: 22px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; z-index: 999; transition: transform 0.2s; }
    .chat-toggle:hover { transform: scale(1.05); }

    /* Finestra Chat */
    .chat-widget { position: fixed; bottom: 90px; right: 24px; width: 390px; height: 540px; background: white; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.15); display: none; flex-direction: column; overflow: hidden; border: 1px solid #eaeaea; z-index: 999; }
    .chat-header { background: #111; color: white; padding: 14px 18px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .chat-close { background: transparent; border: none; color: #aaa; font-size: 18px; cursor: pointer; }

    /* Messaggi */
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 84%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; word-wrap: break-word; }
    .user { background: #111; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #f3f3f5; color: #222; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }
    .bot a { color: #0969da; font-weight: 600; text-decoration: underline; }

    /* Opzioni e Bottoni Rapidi */
    .options-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .option-chip { background: white; border: 1px solid #111; color: #111; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; }
    .option-chip:hover { background: #111; color: white; }
    .option-chip.selected { background: #111; color: white; }

    /* Input Bar */
    .chat-input-bar { display: flex; border-top: 1px solid #eee; padding: 8px 12px; background: #fff; }
    .chat-input-bar input { flex: 1; border: none; padding: 8px; outline: none; font-size: 13.5px; }
    .chat-input-bar button { background: #111; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>

  <h1>Profumeria Demo</h1>
  <p>Clicca sul pulsante in basso a destra per aprire il consulente olfattivo.</p>

  <button class="chat-toggle" onclick="toggleChat()">✨</button>

  <div class="chat-widget" id="chatWindow">
    <div class="chat-header">
      <span>Consulente Olfattivo</span>
      <button class="chat-close" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="messages">
      <div class="msg bot">
        Benvenuto! Sono il tuo consulente olfattivo. Come preferisci procedere?
        <div class="options-container" data-step="0">
          <button class="option-chip" onclick="handleOptionClick(this, '🎯 Guidami nella scelta', null)">🎯 Guidami nella scelta</button>
          <button class="option-chip" onclick="handleOptionClick(this, '💬 Fai una domanda libera', null)">💬 Fai una domanda libera</button>
        </div>
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="userInput" placeholder="Scrivi qui..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Invia</button>
    </div>
  </div>

  <script>
    let currentSessionId = sessionStorage.getItem("advisor_session_id");
    if (!currentSessionId) {
      currentSessionId = "sess_" + Date.now();
      sessionStorage.setItem("advisor_session_id", currentSessionId);
    }

    function toggleChat() {
      const win = document.getElementById('chatWindow');
      win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
      if (win.style.display === 'flex') {
        document.getElementById('userInput').focus();
      }
    }

    function appendMessage(text, sender, options = [], step = null) {
      const box = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = `msg ${sender}`;
      el.innerHTML = text.replace(/\[(.*?)\]\((.*?)\)/g, (match, label, url) => {
        // Se il link contiene il parametro di aggiunta al carrello o una dicitura simile, forza sempre l'italiano
        const lowerLabel = label.toLowerCase();
          if (lowerLabel.includes("cart") || lowerLabel.includes("carrello") || url.includes("add-to-cart")) {
            label = "Aggiungi al Carrello";
          }
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });

      if (options && options.length > 0) {
        const optContainer = document.createElement('div');
        optContainer.className = 'options-container';
        if (step !== null) optContainer.setAttribute('data-step', step);

        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-chip';
          btn.innerText = opt;
          btn.onclick = () => handleOptionClick(btn, opt, step);
          optContainer.appendChild(btn);
        });
        el.appendChild(optContainer);
      }

      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
      return el;
    }

    function handleOptionClick(btnElement, text, step) {
      const parentMsg = btnElement.closest('.msg');
      const box = document.getElementById('messages');

      // 1. Rimuove dalla visualizzazione tutti i messaggi successivi a questo
      let nextNode = parentMsg.nextElementSibling;
      while (nextNode) {
        const toRemove = nextNode;
        nextNode = nextNode.nextElementSibling;
        toRemove.remove();
      }

      // 2. Aggiorna lo stato visivo dei pulsanti in questo contenitore
      const container = btnElement.closest('.options-container');
      container.querySelectorAll('.option-chip').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');

      // 3. Invia la richiesta indicando lo step specifico da resettare
      sendMessage(text, step);
    }

    async function sendMessage(manualText = null, stepOverride = null) {
      const input = document.getElementById('userInput');
      const text = manualText !== null ? manualText : input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      if (manualText === null) input.value = '';

      const loading = appendMessage("Sto consultando il catalogo...", "bot");

      try {
        const res = await fetch("http://127.0.0.1:8000/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: currentSessionId,
            step_override: stepOverride
          })
        });

        const data = await res.json();
        loading.remove();
        appendMessage(data.reply, "bot", data.options, data.step);

      } catch (e) {
        loading.remove();
        appendMessage("Errore di connessione con il server. Verifica che Uvicorn sia attivo.", "bot");
      }
    }
  </script>
</body>
</html>
