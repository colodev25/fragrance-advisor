name: Catalog freshness
on:
  schedule:
    - cron: "10 4 * * *"
      timezone: Europe/Rome
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check latest successful import artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/catalog/operations.py monitor --output "${{ runner.temp }}/catalog-freshness.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-freshness
          path: ${{ runner.temp }}/catalog-freshness.json
          retention-days: 14
          if-no-files-found: warn
