name: Test Suite & Quality Gate

on:
  push:
    branches: [feature/new-site, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [feature/new-site, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: Test Python offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Installazione dipendenze fissate
        run: |
          python -m pip install pip==25.3
          python -m pip install -r requirements/dev.txt
          python -m pip check
      - name: Costruzione indice locale per i test
        run: python src/reindex.py
      - name: Esecuzione di tutti i test offline
        run: python -m pytest tests -m "not e2e" -v --basetemp="${{ runner.temp }}/fragrance-advisor-tests"

  widget-tests:
    name: Test browser offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/widget-tests/package-lock.json
      - name: Installazione strumenti e Chromium
        working-directory: tools/widget-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verifica pagina e snippet Shopify
        working-directory: tools/widget-tests
        run: npm run test:widget
