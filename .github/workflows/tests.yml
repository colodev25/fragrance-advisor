name: Test Suite & Quality Gate

on:
  push:
    branches: [feature/new-site, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [feature/new-site, main]

jobs:
  run-tests:
    name: Esecuzione Test Unitari e di Integrazione
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Costruzione indice locale per i test
        run: |
          python src/reindex.py

      - name: Esecuzione Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSIONS_DB_PATH: ":memory:"
        run: |
          pytest tests/test_api.py tests/test_parsers.py tests/test_session_store.py tests/test_catalog_integrity.py -v
