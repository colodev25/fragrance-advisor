name: Sincronizzazione Catalogo Shopify

on:
  schedule:
    # Local dates alternate from 2026-10-13; see the calendar step.
    - cron: "4 2 * * *"
  # Pulsante per esecuzione manuale istantanea su GitHub Actions
  workflow_dispatch:

# Permessi necessari affinché il workflow possa fare git push sul repository
permissions:
  contents: write

concurrency:
  group: catalog-maintenance-feature-new-site
  cancel-in-progress: false

jobs:
  sync-catalog:
    name: Estrazione Catalogo & Aggiornamento Repo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/new-site
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"
          cache-dependency-path: requirements/catalog.txt

      - name: Check alternating Rome date
        id: calendar
        run: python tools/catalog/operations.py schedule

      - name: Installazione dipendenze minime per ingest
        if: steps.calendar.outputs.run == 'true'
        run: |
          python -m pip install pip==25.3
          python -m pip install -r requirements/catalog.txt
          python -m pip check

      - name: Esecuzione Ingestion da Shopify
        id: ingest
        if: steps.calendar.outputs.run == 'true'
        env:
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
        run: |
          python src/ingest.py

      - name: Commit su GitHub se ci sono variazioni
        if: steps.calendar.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain data/catalog.json data/out_of_stock.json data/catalog_enrichment_state.json)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/out_of_stock.json data/catalog_enrichment_state.json
            git commit -m "chore(catalog): sincronizzazione automatica catalogo [skip ci]"
            git push origin feature/new-site
          else
            echo "[*] Nessuna variazione nel catalogo. Nessun commit necessario."
          fi

      - name: Preserve synchronization report
        if: always() && steps.calendar.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sync-report
          path: data/catalog_sync_report.json
          retention-days: 14
          if-no-files-found: error
