name: Arricchimento notturno catalogo

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-maintenance-feature-new-site
  cancel-in-progress: false

jobs:
  enrich-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout catalogo aggiornato
        uses: actions/checkout@v4
        with:
          ref: feature/new-site
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/catalog.txt

      - name: Installazione dipendenze minime
        run: |
          python -m pip install pip==25.3
          python -m pip install -r requirements/catalog.txt
          python -m pip check

      - name: Elaborazione coda entro il budget
        id: enrich
        timeout-minutes: 25
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_CATALOG_MODEL: openai/gpt-oss-20b
          GROQ_CATALOG_MAX_TOKENS: "2048"
        run: python -m src.catalog_jobs --max-products 30 --token-budget 40000 --max-minutes 20

      - name: Salvataggio progressi e budget
        if: ${{ always() && steps.enrich.outcome != 'skipped' }}
        run: |
          if [ -n "$(git status --porcelain data/catalog.json data/catalog_enrichment_state.json)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/catalog_enrichment_state.json
            git commit -m "chore(catalog): progressi arricchimento notturno [skip ci]"
            git push origin feature/new-site
          else
            echo "Nessuna modifica da pubblicare."
          fi
