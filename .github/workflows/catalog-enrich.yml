name: Arricchimento notturno catalogo

on:
  schedule:
    - cron: "39 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-maintenance-feature-new-site
  cancel-in-progress: false

jobs:
  enrich-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout catalogo aggiornato
        uses: actions/checkout@v4
        with:
          ref: feature/new-site
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/catalog.txt

      - name: Installazione dipendenze minime
        run: |
          python -m pip install pip==25.3
          python -m pip install -r requirements/catalog.txt
          python -m pip check

      - name: Elaborazione coda entro il budget
        id: enrich
        timeout-minutes: 25
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_CATALOG_MODEL: openai/gpt-oss-20b
          GROQ_CATALOG_MAX_TOKENS: "2048"
        run: python -m src.catalog_jobs --max-products 30 --token-budget 40000 --max-minutes 20

      - name: Salvataggio progressi e budget
        id: publish
        if: ${{ always() && steps.enrich.outcome != 'skipped' }}
        run: |
          echo "catalog_changed=false" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain data/catalog.json data/out_of_stock.json data/catalog_enrichment_state.json)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/out_of_stock.json data/catalog_enrichment_state.json
            catalog_changed=true
            suffix="[skip ci]"
            if git diff --cached --quiet -- data/catalog.json data/out_of_stock.json; then
              catalog_changed=false
              suffix="$suffix [skip render]"
            fi
            git commit -m "chore(catalog): progressi arricchimento notturno $suffix"
            git push origin feature/new-site
            echo "catalog_changed=$catalog_changed" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna modifica da pubblicare."
          fi

      - name: Avvio esplicito suite per il catalogo pubblicato
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.catalog_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref feature/new-site --repo "$GITHUB_REPOSITORY"

      - name: Prepare enrichment report
        if: always() && steps.enrich.outcome != 'skipped'
        run: python tools/catalog/operations.py enrichment

      - name: Preserve enrichment report
        if: always() && steps.enrich.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-enrichment-report
          path: data/catalog_enrichment_report.json
          retention-days: 14
          if-no-files-found: error
